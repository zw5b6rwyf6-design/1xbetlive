<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LaserLive247 Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f14;
  color:#fff
}
button,input{
  font:inherit
}
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.box{
  width:100%;
  max-width:390px;
  background:#151a21;
  border:1px solid #252c35;
  border-radius:18px;
  padding:25px
}
.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:5px
}
.sub{
  text-align:center;
  color:#8993a1;
  margin-bottom:25px
}
input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #303844;
  background:#0d1117;
  color:white;
  outline:none
}
.btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#28a745;
  color:white;
  font-weight:bold
}
.error{
  color:#ff7070;
  margin-top:12px;
  font-size:14px
}
#app{display:none}
header{
  padding:17px;
  background:#151a21;
  border-bottom:1px solid #272e37;
  display:flex;
  justify-content:space-between;
  align-items:center
}
header b{font-size:20px}
.logout{
  background:#252c35;
  color:white;
  border:0;
  padding:9px 12px;
  border-radius:8px
}
main{
  max-width:850px;
  margin:auto;
  padding:15px
}
.card{
  background:#151a21;
  border:1px solid #272e37;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}
.stat{
  background:#202630;
  border-radius:10px;
  padding:15px;
  text-align:center
}
.stat strong{
  display:block;
  font-size:23px;
  margin-top:5px
}
.row{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px
}
.row input{margin:0}
.smallbtn{
  padding:10px 12px;
  border:0;
  border-radius:7px;
  background:#303844;
  color:white
}
.match{
  background:#202630;
  border-radius:10px;
  padding:14px;
  margin-top:10px
}
.green{color:#48d878}
.red{color:#ff6565}
.muted{color:#8993a1;font-size:13px}
.badge{
  padding:4px 8px;
  border-radius:20px;
  background:#26372c;
  color:#6de58e;
  font-size:11px
}
.demo{
  text-align:center;
  color:#ffd34e;
  font-size:11px;
  margin-top:20px
}
@media(max-width:500px){
  .stats{grid-template-columns:1fr}
  .row{flex-wrap:wrap}
}
</style>
</head>

<body>

<div class="login" id="login">
  <div class="box">
    <div class="logo">🏏 LaserLive247</div>
    <div class="sub">Admin Dashboard</div>

    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">

    <button class="btn" onclick="loginUser()">LOGIN</button>

    <div id="loginError" class="error"></div>

    <div class="demo">
      SPORTS MANAGEMENT PLATFORM
    </div>
  </div>
</div>


<div id="app">

<header>
  <b>🏏 LaserLive247 Admin</b>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<div class="card">
  <h2>Dashboard</h2>
  <div class="stats">
    <div class="stat">
      Users
      <strong id="userCount">0</strong>
    </div>

    <div class="stat">
      Matches
      <strong id="matchCount">0</strong>
    </div>

    <div class="stat">
      Status
      <strong class="green">ONLINE</strong>
    </div>
  </div>
</div>


<div class="card">
  <h2>➕ Add Match</h2>

  <input id="teamA" placeholder="Team A">
  <input id="teamB" placeholder="Team B">

  <button class="btn" onclick="addMatch()">
    Add Match
  </button>
</div>


<div class="card">
  <h2>🏏 Matches</h2>
  <div id="matches">
    <div class="muted">No matches yet.</div>
  </div>
</div>


<div class="card">
  <h2>👥 Users</h2>
  <div id="users">
    <div class="muted">Loading users...</div>
  </div>
</div>

</main>

</div>


<script>

const SUPABASE_URL = "https://zhgocopnpbdrxarocaas.supabase.co";
const SUPABASE_KEY = "sb_publishable_ax4CulCYABugHSB6RBv3kA_a49Zm257";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loginUser(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if(!email || !password){
    error.textContent =
      "Email aur password enter karo.";
    return;
  }

  const {error:loginError} =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(loginError){
    error.textContent = loginError.message;
    return;
  }

  showApp();
}


async function showApp(){

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";

  await loadUsers();
  await loadMatches();
}


async function logout(){

  await client.auth.signOut();

  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
}


async function loadUsers(){

  const {data,error} =
    await client
      .from("profiles")
      .select("id,username,full_name,role,status,created_at")
      .order("created_at",{ascending:false});

  const box =
    document.getElementById("users");

  if(error){
    box.innerHTML =
      `<div class="red">${error.message}</div>`;
    return;
  }

  document.getElementById("userCount").textContent =
    data.length;

  if(!data.length){
    box.innerHTML =
      `<div class="muted">No users found.</div>`;
    return;
  }

  box.innerHTML = data.map(user => `

    <div class="match">

      <b>${escapeHTML(user.username)}</b>

      <span class="badge">
        ${escapeHTML(user.role)}
      </span>

      <div class="muted">
        ${escapeHTML(user.full_name || "")}
      </div>

      <div class="${user.status==="active"?"green":"red"}">
        ${escapeHTML(user.status)}
      </div>

    </div>

  `).join("");
}


async function loadMatches(){

  const {data,error} =
    await client
      .from("matches")
      .select("*")
      .order("created_at",{ascending:false});

  const box =
    document.getElementById("matches");

  if(error){
    box.innerHTML =
      `<div class="red">${error.message}</div>`;
    return;
  }

  document.getElementById("matchCount").textContent =
    data.length;

  if(!data.length){
    box.innerHTML =
      `<div class="muted">No matches yet.</div>`;
    return;
  }

  box.innerHTML = data.map(match => `

    <div class="match">

      <b>
        ${escapeHTML(match.team_a)}
        vs
        ${escapeHTML(match.team_b)}
      </b>

      <div class="muted">
        Status: ${escapeHTML(match.status)}
      </div>

      <div>
        ${escapeHTML(match.score_a || "0/0")}
        —
        ${escapeHTML(match.score_b || "0/0")}
      </div>

    </div>

  `).join("");
}


async function addMatch(){

  const teamA =
    document.getElementById("teamA").value.trim();

  const teamB =
    document.getElementById("teamB").value.trim();

  if(!teamA || !teamB){
    alert("Dono team names enter karo.");
    return;
  }

  const {error} =
    await client
      .from("matches")
      .insert({
        team_a:teamA,
        team_b:teamB,
        status:"upcoming",
        score_a:"0/0",
        score_b:"0/0"
      });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("teamA").value="";
  document.getElementById("teamB").value="";

  await loadMatches();
}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


client.auth.getSession().then(({data})=>{

  if(data.session){
    showApp();
  }

});

</script>

</body>
</html>
